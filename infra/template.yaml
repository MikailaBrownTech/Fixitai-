AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FixItFast backend - API Gateway REST API in front of one Lambda function.

# Deploy notes are in the README (step 11). Before deploying: run `npm run build -w @fixitfast/backend`
# (it creates backend/dist, which CodeUri points at) and set up a budget alarm.

Parameters:
  LlmProvider:
    Type: String
    Default: mock
    AllowedValues: [mock, anthropic]
    Description: mock is free. anthropic makes paid API calls.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Only needed when LlmProvider=anthropic. Pass it at deploy time, never commit it.
  AnthropicModel:
    Type: String
    Default: ''
    Description: Optional model override. Empty uses the code default.
  ThrottleRate:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 20
    Description: Steady requests per second allowed across ALL visitors combined.
  ThrottleBurst:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 40
    Description: Short-spike allowance above the steady rate.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: Short retention keeps log storage cost near zero.

Resources:
  # We create the log group ourselves so (a) retention is set and (b) the function does not
  # need permission to create log groups.
  SearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-search
      RetentionInDays:
        Ref: LogRetentionDays

  # Least privilege: the ONLY thing this function may do is write to its own log group.
  # There is no wildcard action and no wildcard resource. A Bedrock permission scoped to a single
  # model will be added when we switch providers.
  SearchFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-search:*

  SearchFunction:
    Type: AWS::Serverless::Function
    DependsOn: SearchLogGroup
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-search
      Description: Parses a search with an LLM, validates the result, queries iFixit.
      # Built by `npm run build -w @fixitfast/backend` (esbuild bundles everything into one file).
      CodeUri: ../backend/dist/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 256
      # Must stay above the code's own budget: LLM 8 s + iFixit 4 s, plus headroom.
      Timeout: 15
      Role:
        Fn::GetAtt: [SearchFunctionRole, Arn]
      Environment:
        Variables:
          LLM_PROVIDER:
            Ref: LlmProvider
          ANTHROPIC_API_KEY:
            Ref: AnthropicApiKey
          ANTHROPIC_MODEL:
            Ref: AnthropicModel
      Events:
        Search:
          Type: Api
          Properties:
            RestApiId:
              Ref: SearchApi
            Path: /api/search
            Method: POST

  # A REST API (not an HTTP API) because only REST APIs can validate request bodies at the gateway.
  SearchApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      # One shared bucket for every visitor. This bounds our worst-case cost. It is NOT per-visitor
      # limiting (that needs API keys or WAF, neither fits a public static page).
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit:
            Ref: ThrottleRate
          ThrottlingBurstLimit:
            Ref: ThrottleBurst
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: fixitfast
          version: '1.0'
        x-amazon-apigateway-request-validators:
          body-only:
            validateRequestBody: true
            validateRequestParameters: false
        paths:
          /api/search:
            post:
              x-amazon-apigateway-request-validator: body-only
              # Declared explicitly. When I expanded this template offline, SAM did NOT add the
              # integration by itself, which would have deployed an API that calls nothing.
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchFunction.Arn}/invocations
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/SearchRequest'
              responses:
                '200':
                  description: Search result, or a degraded result
                '400':
                  description: Invalid request
        components:
          schemas:
            # Must match QUERY_MAX_LENGTH and QUERY_PATTERN in packages/shared (a test enforces this).
            # The gateway only validates bodies sent as application/json, and we have NOT yet confirmed
            # how it applies "pattern". The Lambda re-checks everything regardless.
            SearchRequest:
              type: object
              required: [query]
              additionalProperties: false
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: ^[A-Za-z0-9 .,'/&-]+$

  # ---------------------------------------------------------------------------------------------
  # The website: a private S3 bucket behind CloudFront. Visitors talk to ONE domain. CloudFront
  # serves the pages from S3 and forwards /api/* to the API, so the browser never makes a
  # cross-site request and we need no CORS settings.
  # ---------------------------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Origin Access Control: CloudFront signs its requests to S3 so only it can read the bucket.
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Read-only, and only for this one distribution (the SourceArn condition).
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              Fn::Sub: ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # Security headers sent with every response. About the CSP:
  #  - script-src needs 'unsafe-inline' because Next.js writes its page data into inline <script>
  #    tags (checked in the build output). That weakens protection against injected scripts. The
  #    real defense is that we render all third-party text as plain text (tested). The CSP still
  #    blocks scripts loaded from other sites, and connect-src 'self' stops data being sent
  #    anywhere but our own domain.
  #  - No inline styles and no eval are used, so style-src stays strict.
  SiteSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self';
              img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';
              form-action 'self'; frame-ancestors 'none'
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: no-referrer

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: FixItFast site and API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # Cheapest set of edge locations (North America and Europe).
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName:
              Fn::GetAtt: [SiteBucket, RegionalDomainName]
            OriginAccessControlId:
              Fn::GetAtt: [SiteOriginAccessControl, Id]
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName:
              Fn::Sub: ${SearchApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: /prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed policy "CachingOptimized"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId:
            Ref: SiteSecurityHeaders
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            # POST needs the full method list. The API itself only defines POST /api/search.
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            # Managed policy "CachingDisabled": search results are never cached.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed policy "AllViewerExceptHostHeader": forwards the request (including
            # Content-Type) but sends the API its own Host name, which API Gateway requires.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId:
              Ref: SiteSecurityHeaders
        # S3 answers 403 (not 404) for a missing file because the bucket cannot be listed.
        # Show the site's own 404 page for those. Note this applies to every behavior.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  ApiUrl:
    Description: Direct base URL of the API (POST /prod/api/search). Visitors use the CloudFront site instead.
    Value:
      Fn::Sub: https://${SearchApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  FunctionName:
    Value:
      Ref: SearchFunction
  SiteUrl:
    Description: The website. This is the address to share.
    Value:
      Fn::Sub: https://${SiteDistribution.DomainName}
  SiteBucketName:
    Description: Upload the contents of web/out here.
    Value:
      Ref: SiteBucket
  DistributionId:
    Description: Needed to clear CloudFront's cache after an upload.
    Value:
      Ref: SiteDistribution
